apiVersion: apps/v1
kind: Deployment
metadata:
  name: freya-operator
  namespace: freya-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: freya-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freya-operator
    spec:
      serviceAccountName: freya-operator
      containers:
        - name: manager
          image: harbor.dataknife.net/library/freya-operator:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: info
