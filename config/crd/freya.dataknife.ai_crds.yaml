      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for FreyaDiffusionWorkerSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Optional GPU worker for local SD / LoRA (vLLM-Omni by default).

              Placement: - `external` (**recommended**) — point `externalEndpoint` at the GPU host running `freya-local-worker` / vLLM-Omni (or compatible `/v1/images/generations` + LoRA install). Studio stays in-cluster; the worker stays out-of-cluster via URL. - `incluster` (optional) — operator deploys the engine only when the cluster has GPUs.
            properties:
              authSecretRef:
                description: Optional admin/API token Secret for remote LoRA install + generate.
                nullable: true
                properties:
                  key:
                    default: apiKey
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              engine:
                default: vllm-omni
                enum:
                - vllm-omni
                - sglang
                type: string
              externalEndpoint:
                description: 'Required when `placement: external` — e.g. `http://gpu-box.lan:8091`.'
                nullable: true
                type: string
              gpuCount:
                default: 1
                format: int32
                type: integer
              image:
                description: Image reference for Freya components.
                nullable: true
                properties:
                  pullPolicy:
                    nullable: true
                    type: string
                  repository:
                    nullable: true
                    type: string
                  tag:
                    nullable: true
                    type: string
                type: object
              model:
                default: stabilityai/stable-diffusion-xl-base-1.0
                description: HuggingFace / local model id passed to the engine (in-cluster).
                type: string
              modelsPvcSize:
                default: 100Gi
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                nullable: true
                type: object
              placement:
                default: incluster
                description: |-
                  Where the diffusion / LoRA engine runs.

                  CRD enum values are lowercase (`incluster`, `external`). The `inCluster` alias is accepted by Rust serde for convenience; kubectl/OpenAPI only allow `incluster`.
                enum:
                - incluster
                - external
                type: string
              port:
                default: 8091
                format: int32
                type: integer
              storageClassName:
                nullable: true
                type: string
            type: object
          status:
            nullable: true
            properties:
              endpoint:
                nullable: true
                type: string
              phase:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: FreyaDiffusionWorker
        type: object
    served: true
    storage: true
    subresources:
      status: {}

