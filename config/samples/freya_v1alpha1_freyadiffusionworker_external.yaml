# Remote physical GPU box (or any host running vLLM-Omni / freya-worker)
apiVersion: freya.dataknife.ai/v1alpha1
kind: FreyaDiffusionWorker
metadata:
  name: freya-gpu
  namespace: freya
  # Do not set freya.dataknife.ai/tls-insecure on a public HTTPS endpoint.
  # Studio verifies that certificate. The annotation only skips verify for
  # loopback, private, link-local, and cluster DNS hosts.
spec:
  placement: external
  externalEndpoint: http://gpu-box.lan:8091
  engine: vllm-omni
  # Desired worker image — patch tag here, then on the GPU host run:
  #   ./scripts/update-local-worker.sh --from-cr freya-gpu
  image:
    repository: harbor.dataknife.net/library/freya-diffusion-worker
    tag: "f2be1eb"
    pullPolicy: Always
  # Must match FREYA_WORKER_TOKEN on the remote worker process
  authSecretRef:
    name: freya-worker-token
    key: apiKey
