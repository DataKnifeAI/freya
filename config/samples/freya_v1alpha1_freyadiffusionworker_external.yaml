# Remote physical GPU box (or any host running vLLM-Omni / freya-worker)
apiVersion: freya.dataknife.ai/v1alpha1
kind: FreyaDiffusionWorker
metadata:
  name: freya-gpu
  namespace: freya
  annotations:
    # Set when Ingress/worker uses a self-signed cert (local kind). Omit in prod with real TLS.
    freya.dataknife.ai/tls-insecure: "true"
spec:
  placement: external
  # Public vLLM / diffusion worker (not Freya UI — that is freya.dataknife.net).
  # Prefer https. kind-local alternative example:
  #   http://freya-gpu-host.freya.svc.cluster.local:8091
  externalEndpoint: https://vllm.dataknife.net
  engine: vllm-omni
  # Must match FREYA_WORKER_TOKEN on the remote worker process
  authSecretRef:
    name: freya-worker-token
    key: apiKey
