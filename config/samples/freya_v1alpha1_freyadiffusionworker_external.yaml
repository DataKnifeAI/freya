# Remote physical GPU box (or any host running vLLM-Omni / freya-worker)
apiVersion: freya.dataknife.ai/v1alpha1
kind: FreyaDiffusionWorker
metadata:
  name: freya-gpu
  namespace: freya
spec:
  placement: external
  # kind→host: Service/Endpoints to a worker on the kind Docker network, or
  # host gateway (often firewalled on Linux). Example for kind-local worker:
  #   http://freya-gpu-host.freya.svc.cluster.local:8091
  externalEndpoint: http://freya-gpu-host.freya.svc.cluster.local:8091
  engine: vllm-omni
  # Must match FREYA_WORKER_TOKEN on the remote worker process
  authSecretRef:
    name: freya-worker-token
    key: apiKey
