# Optional standalone MCP Deployment+Service (when not using FreyaStudio mcpEnabled).
# Prefer FreyaStudio.spec.mcpEnabled (default true) so the operator owns these + Ingress /mcp.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freya-mcp
  namespace: freya
  labels:
    app.kubernetes.io/name: freya
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: freya
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freya
        app.kubernetes.io/component: mcp
    spec:
      containers:
        - name: mcp
          image: harbor.dataknife.net/library/freya-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: FREYA_API_URL
              value: http://freya-api:8080
            - name: FREYA_MCP_BIND
              value: 0.0.0.0:8090
            - name: FREYA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: freya-api-token
                  key: token
            # Empty or * is loopback only and does not disable the check.
            # Append an Ingress hostname when this Service is published.
            - name: FREYA_MCP_ALLOWED_HOSTS
              value: freya-mcp,freya-mcp.freya,freya-mcp.freya.svc,freya-mcp.freya.svc.cluster.local,localhost,127.0.0.1,::1
---
apiVersion: v1
kind: Service
metadata:
  name: freya-mcp
  namespace: freya
  labels:
    app.kubernetes.io/name: freya
    app.kubernetes.io/component: mcp
spec:
  selector:
    app.kubernetes.io/name: freya
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8090
      targetPort: 8090
