apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: freya-operator
rules:
  - apiGroups: ["freya.dataknife.ai"]
    resources:
      - freyastudios
      - freyastudios/status
      - freyagenerations
      - freyagenerations/status
      - freyastyles
      - freyastyles/status
      - freyadiffusionworkers
      - freyadiffusionworkers/status
      - freyamodelassets
      - freyamodelassets/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
