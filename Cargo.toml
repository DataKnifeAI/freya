[workspace]
resolver = "2"
members = [
    "crates/freya-crd",
    "crates/freya-operator",
    "crates/freya-api",
    "crates/freya-worker",
]
default-members = [
    "crates/freya-crd",
    "crates/freya-operator",
    "crates/freya-api",
    "crates/freya-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/DataKnifeAI/freya"
authors = ["DataKnifeAI"]

[workspace.dependencies]
freya-crd = { path = "crates/freya-crd" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "0.98", default-features = true, features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
