<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Freya">
  <title>Freya — portrait</title>
  <!-- Portrait headshot cropped from freya.png (face, dark hair, eagle-wing edge).
       Raster embedded: a vector cannot carry the painted face at 16-32px. -->
  <defs><clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath></defs>
  <rect width="64" height="64" rx="14" fill="#0e1418"/>
  <image href="data:image/png;base64," width="64" height="64" clip-path="url(#r)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#e8c4a8" stroke-opacity=".55"/>
</svg>
