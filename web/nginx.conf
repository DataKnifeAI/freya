server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # FREYA_API_UPSTREAM defaults to http://freya-api:8080; operator sets
  # http://{studio}-api:8080 via envsubst on the official nginx image templates dir.
  location /v1/ {
    proxy_pass ${FREYA_API_UPSTREAM}/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Forward caller Authorization only — never inject the API bearer here.
    # Browsers send it via Settings → Studio API token (localStorage / VITE_FREYA_API_TOKEN).
    proxy_set_header Authorization $http_authorization;
    # Chat streams status lines (Thinking / Searching / Generating / Downloading).
    proxy_buffering off;
    gzip off;
    add_header X-Accel-Buffering no;
  }

  location /healthz {
    proxy_pass ${FREYA_API_UPSTREAM}/healthz;
  }

  location / {
    try_files $uri /index.html;
  }
}
