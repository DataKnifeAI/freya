server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    proxy_pass http://freya-api:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /healthz {
    proxy_pass http://freya-api:8080/healthz;
  }

  location / {
    try_files $uri /index.html;
  }
}
